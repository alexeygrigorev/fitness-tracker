# fly.toml - Fly.io configuration for Fitness Tracker
app = "rough-leaf-5415"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  DJANGO_SETTINGS_MODULE = "config.settings"
  DJANGO_ALLOWED_HOSTS = ".fly.dev,fitness-tracker.fly.dev"
  DJANGO_CSRF_TRUSTED_ORIGINS = "https://rough-leaf-5415.fly.dev"
  DJANGO_TRUST_PROXY_TLS = "true"
  DEBUG = "false"
  SERVE_FRONTEND = "true"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "30s"
  timeout = "10s"
  grace_period = "10s"
  method = "GET"
  path = "/api/health/"

[[mounts]]
  source = "sqlite_data"
  destination = "/app/backend/db"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-tests:
    name: TypeScript backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend-ts/package-lock.json

      - name: Install dependencies
        working-directory: backend-ts
        run: npm ci

      - name: Typecheck, test, and build
        working-directory: backend-ts
        run: |
          npm run typecheck
          npm run test:integration
          npm run build

  frontend-tests:
    name: Frontend unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run unit tests
        working-directory: web
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm test -- --reporter=verbose

  e2e-tests:
    name: Local TypeScript E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend-ts/package-lock.json
            web/package-lock.json
            e2e/package-lock.json

      - name: Install backend dependencies
        working-directory: backend-ts
        run: npm ci

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install E2E dependencies and browsers
        working-directory: e2e
        run: |
          npm ci
          npm run install:browsers

      - name: Run the complete local flow
        run: bash ./e2e/run-local-ts.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

  lambda-artifact-tests:
    name: Lambda artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend-ts/package-lock.json
            web/package-lock.json

      - name: Install SAM CLI
        uses: aws-actions/setup-sam@v2

      - name: Install backend dependencies
        working-directory: backend-ts
        run: npm ci

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      - name: Verify SAM-built Lambda artifact
        working-directory: backend-ts
        run: npm run verify:artifact

AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Fitness Tracker TypeScript API foundation.

Parameters:
  JwtSecret:
    Type: String
    NoEcho: true
    MinLength: 50
  FrontendBuild:
    Type: String
    Default: /var/task/frontend
    Description: Absolute Lambda path to the packaged SPA build.
  AllowedOrigins:
    Type: String
    Default: ''
    Description: Comma-separated browser origins allowed by the application CORS handler.
  AuthBaseUrl:
    Type: String
    Default: https://auth.dtcdev.click
  AuthClientId:
    Type: String
  AuthIssuer:
    Type: String
  AuthJwksUrl:
    Type: String
  DomainName:
    Type: String
    Default: gym.dtcdev.click

Resources:
  Api:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/lambda.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 29
      AutoPublishAlias: live
      AutoPublishAliasAllProperties: true
      DeploymentPreference:
        Type: AllAtOnce
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          JWT_SECRET: !Ref JwtSecret
          NODE_ENV: production
          FRONTEND_BUILD: !Ref FrontendBuild
          ALLOWED_ORIGINS: !Ref AllowedOrigins
          AUTH_BASE_URL: !Ref AuthBaseUrl
          AUTH_CLIENT_ID: !Ref AuthClientId
          AUTH_CALLBACK_URL: !Sub https://${DomainName}/auth/callback
          AUTH_LOGOUT_URL: !Sub https://${DomainName}/
          AUTH_ISSUER: !Ref AuthIssuer
          AUTH_JWKS_URL: !Ref AuthJwksUrl
      Policies:
        - Statement:
            - Sid: TableRecords
              Effect: Allow
              Action:
                - dynamodb:DescribeTable
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Scan
                - dynamodb:TransactWriteItems
              Resource: !GetAtt Table.Arn
            - Sid: BaseTableAndIndexQueries
              Effect: Allow
              Action: dynamodb:Query
              Resource:
                - !GetAtt Table.Arn
                - !Sub '${Table.Arn}/index/*'
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED

      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default

  Table:
    Type: AWS::DynamoDB::Table
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: username
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: UsernameIndex
          KeySchema:
            - AttributeName: username
              KeyType: HASH
          Projection:
            ProjectionType: KEYS_ONLY
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: KEYS_ONLY
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true

Outputs:
  HttpApiId:
    Value: !Ref HttpApi
  HttpApiEndpoint:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  FunctionUrl:
    Value: !GetAtt ApiUrl.FunctionUrl

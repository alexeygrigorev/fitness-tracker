AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Fitness Tracker TypeScript API foundation.

Parameters:
  JwtSecret:
    Type: String
    NoEcho: true
    MinLength: 50
  AllowedOrigins:
    Type: String
    Default: ''
    Description: Comma-separated browser origins allowed by the application CORS handler.

Resources:
  Api:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: dist/lambda.handler
      Runtime: nodejs24.x
      Architectures:
        - arm64
      MemorySize: 512
      Timeout: 29
      AutoPublishAlias: live
      DeploymentPreference:
        Type: AllAtOnce
      Environment:
        Variables:
          TABLE_NAME: !Ref Table
          JWT_SECRET: !Ref JwtSecret
          ALLOWED_ORIGINS: !Ref AllowedOrigins
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:BatchGetItem
                - dynamodb:TransactWriteItems
              Resource:
                - !GetAtt Table.Arn
                - !Sub '${Table.Arn}/index/*'
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: BUFFERED
        Cors:
          AllowOrigins:
            - '*'
          AllowMethods:
            - GET
            - POST
            - PATCH
            - OPTIONS
          AllowHeaders:
            - Authorization
            - Content-Type

  Table:
    Type: AWS::DynamoDB::Table
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
        - AttributeName: username
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: UsernameIndex
          KeySchema:
            - AttributeName: username
              KeyType: HASH
          Projection:
            ProjectionType: KEYS_ONLY
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: KEYS_ONLY
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      SSESpecification:
        SSEEnabled: true
